name: Quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: voysse_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: voysse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voysse_test -d voysse_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://voysse_test:test-only@127.0.0.1:5432/voysse_test
      TEST_DATABASE_URL: postgresql+psycopg://voysse_test:test-only@127.0.0.1:5432/voysse_test
      STORAGE_DIR: /tmp/voysse-test-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations round-trip on disposable database
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, marketing]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/whatsapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
